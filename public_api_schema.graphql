schema {
  query: Query
  mutation: Mutation
}

enum AcceptanceStatus {
  GUESTLIST
  ACTIVE
  INACTIVE
}

enum AccountMergeStatus {
  PENDING
  DONE
  ABANDONED
}

enum AccountStatus {
  MANAGED
  CLAIMING
  CLAIMED
  BANNED
}

enum AuditLogSeverity {
  TRACE
  DEBUG
  INFO
  WARN
  FAIL
}

enum CampaignKind {
  XREPOST
  COMMUNITY_GIVEAWAY
}

enum CampaignStatus {
  DRAFT
  SUBMITTED
  PUBLISHED
  FAILED
}

enum CollabStatus {
  PENDING
  REGISTERED
  CLEARED
