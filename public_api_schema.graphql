  EN
}

enum OnChainJobKind {
  PROMOTE_SUB_ACCOUNTS
  ADMIN_LEGACY_CLAIM_ACCOUNT
  ADMIN_CLAIM_BALANCES_FREE
  GASLESS_CLAIM_BALANCES
  REIMBURSE_CAMPAIGNS
  SUBMIT_REPORTS
  MAKE_COLLABS
  MAKE_SUB_ACCOUNT_COLLABS
  CLAIM_FEE_POOL_SHARE
  APPLY_VOTED_FEE_RATE
}

enum OnChainJobStatus {
  SCHEDULED
  SKIPPED
  REVERTED
  SUBMITTED
  FAILED
  CONFIRMED
  SETTLED
}

