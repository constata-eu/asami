  updateCommunityMember(id: Int!, data: EditCommunityMemberInput!): CommunityMember!
  updateAccount(id: String!, data: AdminEditAccountInput!): Account!
  createCommunityMember(input: CreateCommunityMemberInput!): CommunityMember!
  createCommunityMemberMembership(input: CreateCommunityMemberMembershipInput!): CommunityMember!
  createCommunityMemberSkip(input: CreateCommunityMemberSkipInput!): CommunityMemberSkip!
