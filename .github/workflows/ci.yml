name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out with contract dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test

      - name: Check Solidity formatting
        run: forge fmt --check

      - name: Test contract
        run: forge test

      - name: Build landing page
        run: |
          npm --prefix pwa ci
          npm --prefix pwa run build

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - name: Check out with contract dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run the complete scenario
        run: scripts/e2e
